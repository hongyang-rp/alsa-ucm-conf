SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		# AudioReach needs the routes before the PCMs can be probed.
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='QUATERNARY_MI2S_RX Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer PRIMARY_MI2S_TX' 1"
		# Set the AudioReach Q13 stream gains to 0 dB.
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
		# Initialize the codec gains and leave headphones disabled.
		cset "name='Headphone Mixer Volume' 11"
		cset "name='DAC Playback Volume' 192"
		cset "name='Left Headphone Mixer Left DAC Switch' off"
		cset "name='Right Headphone Mixer Right DAC Switch' off"
		cset "name='ADC Capture Volume' 192"
		# Set the microphone preamplifier gain to +16 dB.
		cset "name='ADC PGA Gain Volume' 7"
		cset "name='ALC Capture Switch' off"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='QUATERNARY_MI2S_RX Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer PRIMARY_MI2S_TX' 0"
		cset "name='Left Headphone Mixer Left DAC Switch' off"
		cset "name='Right Headphone Mixer Right DAC Switch' off"
	]
}

SectionDevice."HDMI" {
	Comment "HDMI Digital Stereo Output"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackFormat "S16_LE"
	}

	EnableSequence [
		cset "name='QUATERNARY_MI2S_RX Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='QUATERNARY_MI2S_RX Audio Mixer MultiMedia2' 0"
	]
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackFormat "S16_LE"
		PlaybackMixerElem "DAC"
		JackControl "Headphone Jack"
	}

	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Headphone Playback Volume' 2"
		cset "name='Left Headphone Mixer Left DAC Switch' on"
		cset "name='Right Headphone Mixer Right DAC Switch' on"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='Left Headphone Mixer Left DAC Switch' off"
		cset "name='Right Headphone Mixer Right DAC Switch' off"
	]
}

SectionDevice."Mic" {
	Comment "Headset microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureFormat "S16_LE"
		CaptureMixerElem "ADC"
		JackControl "Mic Jack"
	}

	EnableSequence [
		cset "name='Differential Mux' lin2-rin2"
		cset "name='Digital Mic Mux' 'dmic disable'"
		cset "name='MultiMedia3 Mixer PRIMARY_MI2S_TX' 1"
	]

	DisableSequence [
		cset "name='MultiMedia3 Mixer PRIMARY_MI2S_TX' 0"
	]
}
